#
# Cuts a GitHub Release when a v* tag is pushed.
#
# Scope is deliberately narrow: this workflow verifies the tag, generates
# release notes from the changelog, creates the GitHub Release, and opens a PR
# that syncs CHANGELOG.md on main. It does NOT build the extension binaries —
# MainDistributionPipeline.yml already builds the cross-platform
# .duckdb_extension artifacts on the same v* tag via DuckDB's reusable pipeline.
#
# Fast fmt/clippy/test feedback lives in rust.yml (every push/PR); the release
# gate below re-runs the unit tests so a tag can never ship a red build.
#
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Verify build is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

  release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        run: |
          git-cliff --latest --strip all > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-changelog:
    name: Update CHANGELOG.md
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Regenerate full changelog
        run: git-cliff --output CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with updated changelog
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="chore/changelog-${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: update CHANGELOG.md for ${{ github.ref_name }}" \
            --body "Auto-generated changelog update after release ${{ github.ref_name }}."
        env:
          GH_TOKEN: ${{ github.token }}
