#
# Cuts a GitHub Release when a v* tag is pushed.
#
# Scope is deliberately narrow: this workflow verifies the tag and generates the
# release notes (from conventional commits, via git-cliff) into the GitHub
# Release body. There is no committed CHANGELOG.md — the GitHub Releases page is
# the rendered changelog, and the git history is its source. This workflow does
# NOT build the extension binaries; MainDistributionPipeline.yml already builds
# the cross-platform .duckdb_extension artifacts on the same v* tag via DuckDB's
# reusable pipeline.
#
# Fast fmt/clippy/test feedback lives in rust.yml (every push/PR); the release
# gate below re-runs the unit tests so a tag can never ship a red build.
#
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Verify build is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

  release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate release notes
        run: |
          git-cliff --latest --strip all > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
