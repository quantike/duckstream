#
# Builds and tests the extension for all supported DuckDB platforms by calling
# DuckDB's reusable distribution pipeline. This is the same toolchain the
# community-extensions repository uses, so an extension that builds here builds
# there.
#
# Runs on main pushes (a cross-platform smoke check of the development line), on
# tagged releases (vMAJOR.MINOR.PATCH snapshots cut from main), and on manual
# dispatch. Fast fmt/clippy/test feedback lives in rust.yml and runs on every
# push and pull request.
#
name: Main Extension Distribution Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: duckstream
      # Our extension is pure Rust and the test harness uses the DuckDB Python
      # client, so we need both toolchains available in the build image.
      extra_toolchains: rust;python3
      # WASM is excluded: the extension needs a Tokio multi-thread runtime and
      # async-nats TCP networking, neither of which exists in the browser WASM
      # sandbox. Other networking Rust extensions (chsql_native, pcap_reader)
      # exclude it the same way. musl is not exercised yet.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl'
